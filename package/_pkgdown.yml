url: https://diogro.github.io/stanimal/
destination: ../docs

# Shared site layout (same in stanimal, indri, grnland, evomod2): build with
# `Rscript pkgdown/build_site.R`; the look is in pkgdown/extra.scss and only
# the accent colour below is per package. The home page is the README.
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#2e5878"

home:
  title: "stanimal: Bayesian animal models in Stan"
  links:
  - text: Guide for agents (AGENTS.md)
    href: https://github.com/diogro/stanimal/blob/master/AGENTS.md
  - text: Developer notes (DEVELOPMENT.md)
    href: https://github.com/diogro/stanimal/blob/master/DEVELOPMENT.md

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]

reference:
- title: Fitting models
  contents:
  - lmm_animal
  - lm_phen_cov
  - laplace
  - lmm_animal_gibbs
- title: Building the inputs
  contents:
  - animal_design
  - makeA
  - genomic_relationship
  - size_shape
  - back_transform
  - pc1_variance_share
- title: Choosing the number of factors
  contents:
  - suggest_n_factors
  - scree_eigenvalues
  - plot.scree
- title: Reading the posterior
  contents:
  - fit_draws
  - draws_mean
  - rename_beta
  - to_draws_list
  - animal_parameter_draws
- title: Post-processing a fit
  contents:
  - breeding_values
  - imputed_data
  - fit_loo
  - posterior_predictive
- title: Plots
  contents:
  - plot_prior_posterior
  - plot_G_ellipses
  - plot_corr
- title: Priors and simulation
  contents:
  - animal_prior_draws
  - random_covariance
- title: Data
  contents:
  - ratones_morpho
  - ratones_pedigree
  - opossum
- title: Package
  contents:
  - stanimal-package
  - stan_cache_dir

articles:
- title: Animal models
  navbar: Animal models
  contents:
  - univariate
  - multivariate
  - ratones
  - factor-model
  - structure-comparison
- title: Working with a fit
  navbar: Working with a fit
  contents:
  - imputation
  - breeding-values
- title: Phenotypic covariance
  navbar: Phenotypic covariance
  contents:
  - phenotypic-covariance
  - factor-phenotypic-covariance
- title: Other engines
  navbar: Other engines
  contents:
  - laplace
  - gibbs
